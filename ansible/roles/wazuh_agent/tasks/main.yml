---
- name: Add Wazuh APT key
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /usr/share/keyrings/wazuh.gpg.key
    mode: "0644"

- name: Import Wazuh GPG key
  ansible.builtin.shell: >
    gpg --no-default-keyring --keyring /usr/share/keyrings/wazuh.gpg
    --import /usr/share/keyrings/wazuh.gpg.key
  args:
    creates: /usr/share/keyrings/wazuh.gpg

- name: Add Wazuh APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
    filename: wazuh
    state: present

# The agent must never be newer than the manager, or enrolment is rejected.
- name: Install the Wazuh agent pinned to the manager version
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_agent_version }}-1"
    state: present
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_ip }}"
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a

- name: Hold the agent so apt upgrades cannot move it past the manager
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Set the manager address in the agent config
  ansible.builtin.lineinfile:
    path: /var/ossec/etc/ossec.conf
    regexp: '<address>.*</address>'
    line: "      <address>{{ wazuh_manager_ip }}</address>"
  notify: Restart wazuh-agent

- name: Monitor the WAF vhost logs (ModSecurity alerts)
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} BYTELAB WAF LOGS -->"
    block: |
      <ossec_config>
        <localfile>
          <log_format>apache</log_format>
          <location>/var/log/apache2/waf-access.log</location>
        </localfile>
        <localfile>
          <log_format>apache</log_format>
          <location>/var/log/apache2/waf-error.log</location>
        </localfile>
      </ossec_config>
  when: "'waf' in group_names"
  notify: Restart wazuh-agent

- name: Enable and start the agent
  ansible.builtin.service:
    name: wazuh-agent
    state: started
    enabled: true
